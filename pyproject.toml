[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"bot/main.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pyright]
include = ["bot", "src", "tests", "main.py", "main_worker.py"]
extraPaths = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: pruebas contra APIs reales (requieren red; make test-live)"]
addopts = "-m 'not live'"
# Un coroutine que nunca se espera suele ser un bug real (tarea perdida).
filterwarnings = ["error:coroutine .* was never awaited:RuntimeWarning"]
