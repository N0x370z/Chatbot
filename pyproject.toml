[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"bot/main.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pyright]
include = ["bot", "src", "tests", "main.py", "main_worker.py"]
extraPaths = ["."]
