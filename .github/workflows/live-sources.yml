name: Fuentes de libros (live)

# Comprueba cada semana que todas las fuentes siguen buscando y descargando.
# Si una API cambia o cae, este workflow falla aunque el código no cambie.
on:
  schedule:
    - cron: "0 9 * * 1"  # lunes 09:00 UTC
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run live source tests
        run: pytest -m live -v -rxX
